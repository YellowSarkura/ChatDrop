<!-- 相亲面板片段：由 /blinddate/client.js 注入到 .main-pane 的最前面（左侧） -->
<section class="bd-pane" id="blindDatePane" hidden>

  <div class="bd-top">
    <div class="bd-heading">
      <h2>相亲</h2>
      <span class="bd-count" id="bdCount"></span>
      <button class="bd-collapse" id="btnBdCollapse" type="button" title="收起相亲表格">
        收起
        <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="bd-toolbar">
      <button class="bd-add" id="btnBdAdd" type="button">＋ 新增一行</button>
      <button class="bd-refresh" id="btnBdRefresh" type="button">刷新</button>
      <span class="bd-status" id="bdStatus">共享表格 · 自动保存</span>
    </div>
  </div>

  <div class="bd-scroll" id="bdScroll">
    <table class="bd-table">
      <thead>
        <tr id="bdHead"></tr>
      </thead>
      <tbody id="bdBody"></tbody>
    </table>
    <div class="bd-empty" id="bdEmpty" hidden>还没有数据，点「＋ 新增一行」开始填写</div>
  </div>
</section>
